<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>今後試してみたいこと</title>
  <style>
    :root { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #1f2328; background: #f6f8fa; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    main { width: min(920px, calc(100% - 32px)); margin: 64px auto; }
    header { margin-bottom: 32px; }
    h1 { margin: 0 0 12px; font-size: clamp(2rem, 6vw, 3.5rem); }
    p { line-height: 1.8; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; }
    .card { background: white; border: 1px solid #d0d7de; border-radius: 14px; padding: 20px; box-shadow: 0 6px 20px rgba(31, 35, 40, 0.06); }
    .card h2 { margin-top: 0; font-size: 1.15rem; }
    footer { margin-top: 32px; color: #57606a; font-size: 0.9rem; }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>今後試してみたいこと</h1>
      <p>GitHub と ChatGPT を使いながら、これから試したい機能や開発アイデアを記録するページです。</p>
    </header>

    <section class="grid" aria-label="試してみたいこと一覧">
      <article class="card">
        <h2>GitHub Issue で作業依頼</h2>
        <p>Issue に要望を書き、ChatGPT に内容を確認してもらって実装まで進める。</p>
      </article>
      <article class="card">
        <h2>Pull Request のレビュー</h2>
        <p>変更差分を確認し、問題点や改善案をレビューしてもらう。</p>
      </article>
      <article class="card">
        <h2>GitHub Actions</h2>
        <p>テストや自動処理を追加し、失敗したときの原因調査も試す。</p>
      </article>
      <article class="card">
        <h2>GitHub Pages</h2>
        <p>HTML を公開し、リポジトリを簡単なWebサイトとして利用する。</p>
      </article>
    </section>

    <footer>test_project / Issue #3</footer>
  </main>
</body>
</html>
