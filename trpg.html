<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI TRPG Adventure</title>
  <style>
    :root { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #202124; background: #f6f7fb; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    main { width: min(960px, calc(100% - 32px)); margin: 32px auto 64px; }
    h1 { margin-bottom: 8px; }
    .sub { color: #5f6368; margin-top: 0; }
    .panel { background: #fff; border: 1px solid #dfe3eb; border-radius: 14px; padding: 20px; margin-top: 18px; box-shadow: 0 8px 30px rgba(0,0,0,.04); }
    .grid { display: grid; grid-template-columns: repeat(auto-fit,minmax(220px,1fr)); gap: 12px; }
    label { display: grid; gap: 6px; font-weight: 600; }
    input, textarea, button { font: inherit; }
    input, textarea { width: 100%; border: 1px solid #c8ccd4; border-radius: 9px; padding: 10px 12px; background: #fff; }
    textarea { min-height: 84px; resize: vertical; }
    button { border: 0; border-radius: 10px; padding: 11px 16px; cursor: pointer; background: #1a73e8; color: white; font-weight: 700; }
    button.secondary { background: #eef2f8; color: #202124; }
    button:disabled { opacity: .55; cursor: wait; }
    .choices { display: grid; gap: 10px; margin-top: 14px; }
    .choices button { text-align: left; }
    .story { white-space: pre-wrap; line-height: 1.75; }
    .result { padding: 12px; background: #f4f7fb; border-radius: 10px; margin-bottom: 14px; }
    .history { display: grid; gap: 8px; padding-left: 20px; }
    .hidden { display: none; }
    .status { font-size: .9rem; color: #5f6368; }
    .error { color: #b3261e; white-space: pre-wrap; }
  </style>
</head>
<body>
<main>
  <h1>AI TRPG Adventure</h1>
  <p class="sub">AIがゲームマスターとなり、問題と選択肢を提示して冒険を進行します。</p>

  <section class="panel">
    <label>API Base URL
      <input id="apiBaseUrl" placeholder="https://your-api.example.com" value="https://localhost:7103">
    </label>
    <p class="status">例: https://localhost:7103 または公開済みASP.NET Core APIのURL</p>
  </section>

  <section id="setup" class="panel">
    <div class="grid">
      <label>名前<input id="name" value="リリィ"></label>
      <label>職業<input id="job" value="魔法使い"></label>
      <label>性格<input id="personality" value="勇敢で好奇心旺盛"></label>
      <label>舞台<input id="place" value="忘れられた森"></label>
    </div>
    <label style="margin-top:12px">目的<textarea id="objective">森の奥に眠る古代の遺物を見つける</textarea></label>
    <button id="start" style="margin-top:14px">冒険に出る</button>
  </section>

  <section id="game" class="panel hidden">
    <p id="status" class="status"></p>
    <div id="result" class="result hidden"></div>
    <h2>現在の状況</h2>
    <div id="scene" class="story"></div>
    <h2>問題</h2>
    <div id="problem" class="story"></div>
    <div id="choices" class="choices"></div>
    <div style="margin-top:14px">
      <label>自由入力で行動する<input id="customAction" placeholder="例: 魔法で周囲を照らしながら慎重に進む"></label>
      <button id="customActionButton" class="secondary" style="margin-top:8px">この行動を選ぶ</button>
    </div>
    <p id="error" class="error"></p>
  </section>

  <section id="historyPanel" class="panel hidden">
    <h2>冒険履歴</h2>
    <ol id="history" class="history"></ol>
  </section>
</main>
<script>
  const state = { history: [], character: null };
  const $ = id => document.getElementById(id);

  $('start').addEventListener('click', async () => {
    state.character = {
      name: $('name').value.trim(),
      job: $('job').value.trim(),
      personality: $('personality').value.trim(),
      place: $('place').value.trim(),
      objective: $('objective').value.trim()
    };
    state.history = [];
    $('history').innerHTML = '';
    $('game').classList.remove('hidden');
    $('historyPanel').classList.remove('hidden');
    await playTurn(null);
  });

  $('customActionButton').addEventListener('click', async () => {
    const action = $('customAction').value.trim();
    if (!action) return;
    $('customAction').value = '';
    await playTurn(action);
  });

  async function playTurn(action) {
    setBusy(true);
    $('error').textContent = '';
    try {
      const apiBaseUrl = $('apiBaseUrl').value.trim().replace(/\/$/, '');
      if (!apiBaseUrl) throw new Error('API Base URLを入力してください。');

      const body = { ...state.character, action, history: state.history };
      const response = await fetch(`${apiBaseUrl}/api/adventure/keeper`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });

      let data;
      try {
        data = await response.json();
      } catch {
        throw new Error(`APIからJSON以外の応答が返りました。HTTP ${response.status}`);
      }

      if (!response.ok) throw new Error(data.detail || data.title || `API request failed (${response.status})`);

      if (action) {
        const summary = `行動: ${action}\n結果: ${data.result || '結果なし'}\n次の状況: ${data.scene}`;
        state.history.push(summary);
        const li = document.createElement('li');
        li.textContent = summary;
        $('history').appendChild(li);
      }

      $('scene').textContent = data.scene;
      $('problem').textContent = data.problem;
      $('status').textContent = `rawResponseId: ${data.rawResponseId}`;
      $('result').textContent = data.result || '';
      $('result').classList.toggle('hidden', !data.result);
      renderChoices(data.choices || [], data.status);
    } catch (err) {
      $('error').textContent = err.message + '\nAPIがHTTPSの場合は証明書エラーやCORS設定も確認してください。';
    } finally {
      setBusy(false);
    }
  }

  function renderChoices(choices, status) {
    const container = $('choices');
    container.innerHTML = '';
    if (status === 'complete') {
      const done = document.createElement('p');
      done.textContent = '冒険の目的を達成しました。新しい冒険を始める場合は上の設定から再開してください。';
      container.appendChild(done);
      return;
    }

    for (const choice of choices) {
      const button = document.createElement('button');
      button.textContent = choice;
      button.addEventListener('click', () => playTurn(choice));
      container.appendChild(button);
    }
  }

  function setBusy(busy) {
    document.querySelectorAll('button').forEach(button => button.disabled = busy);
  }
</script>
</body>
</html>
